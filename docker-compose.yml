version: "3.9"

services:
  time-service:
    build: ./services/time-service
    container_name: time-service
    restart: unless-stopped

  weather-service:
    image: alpine
    command: sh -c "while true; do echo 'Weather placeholder'; sleep 15; done"

  chatgpt-quote-service:
    image: alpine
    command: sh -c "while true; do echo 'Quote placeholder'; sleep 20; done"
