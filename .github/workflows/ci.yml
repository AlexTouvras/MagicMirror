name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  python-check-and-tests:
    name: Python syntax + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run py_compile across repository
        run: |
          python -m py_compile $(git ls-files '*.py') || true
        shell: bash

      - name: Run tests (weather normalization)
        # supply minimal env required by app import/validation
        env:
          WEATHER_LAT: 52.3676
          WEATHER_LON: 4.9041
          WEATHER_TIMEZONE: Europe/Amsterdam
          WEATHER_TEMPERATURE_UNIT: celsius
          WEATHER_WIND_SPEED_UNIT: kmh
          WEATHER_FORECAST_DAYS: 3
        run: |
          python -m pytest -q

  build-images:
    name: Build Docker service images (validate Dockerfiles)
    runs-on: ubuntu-latest
    needs: python-check-and-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Build time-service image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./services/time-service
          file: ./services/time-service/Dockerfile
          push: false
          tags: smart-mirror-backend-time-service:ci
          platforms: linux/amd64,linux/arm64

      - name: Build weather-service image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./services/weather-service
          file: ./services/weather-service/Dockerfile
          push: false
          tags: smart-mirror-backend-weather-service:ci
          platforms: linux/amd64,linux/arm64
